# Aisla el efecto de conmutar la alimentacion del KY-018 respecto al perfil
# system-managed. ADC/UART siguen directos y System-managed permanece activo;
# la unica diferencia es apagar D4/PB5 entre adquisiciones.
CONFIG_PM=y
CONFIG_DEMO_SENSOR_POWER_ALWAYS_ON=n
CONFIG_DEMO_RUNTIME_PM_DEVICES=n
CONFIG_PM_DEVICE_SYSTEM_MANAGED=y
