# Perfil de mayor consumo: no usa gestion energetica del sistema ni de los
# dispositivos. Sin PM del sistema el MCU no entra en STOP, por lo que ADC y
# UART pueden permanecer activos sin Runtime PM ni System-managed.
CONFIG_PM=n
CONFIG_DEMO_SENSOR_POWER_ALWAYS_ON=y
CONFIG_DEMO_RUNTIME_PM_DEVICES=n
CONFIG_PM_DEVICE_SYSTEM_MANAGED=n
