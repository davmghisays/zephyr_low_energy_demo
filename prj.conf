# Configuracion comun a todos los perfiles.
CONFIG_ADC=y
CONFIG_PM=y
CONFIG_PM_POLICY_DEFAULT=y
CONFIG_TICKLESS_KERNEL=y
# El driver del tick de bajo consumo LPTIM1 usa el controlador reset de STM32.
# Sin consola ninguna otra opcion lo selecciona de forma indirecta, por eso se
# habilita explicitamente tambien en los perfiles silenciosos.
CONFIG_RESET=y

# No se usa radio, BLE, red, LED ni logging.
CONFIG_LOG=n
CONFIG_GPIO=n
CONFIG_PM_DEVICE=n
