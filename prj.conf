# Configuracion unica de la demo.
CONFIG_ADC=y
CONFIG_PM=y
CONFIG_PM_POLICY_DEFAULT=y
CONFIG_TICKLESS_KERNEL=y
# El driver del tick de bajo consumo LPTIM1 usa el controlador reset de STM32.
CONFIG_RESET=y

# System-managed prepara los dispositivos al entrar en un estado STOP.
# Runtime PM permite suspender ADC y UART incluso sin suspender todo el sistema.
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_SYSTEM_MANAGED=y
CONFIG_PM_DEVICE_RUNTIME=y
# La consola solicita la suspension asincrona de la UART al terminar de enviar.
CONFIG_PM_DEVICE_RUNTIME_ASYNC=y
# Solo se aplica Runtime PM a los dispositivos habilitados desde main.c.
CONFIG_PM_DEVICE_RUNTIME_DEFAULT_ENABLE=n

# No se usa radio, BLE, red, LED ni logging.
CONFIG_LOG=n
CONFIG_GPIO=y

# Una lectura por segundo y salida permanente por el monitor serie.
CONFIG_DEMO_SAMPLE_INTERVAL_MS=1000
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=n

CONFIG_ASSERT=y
CONFIG_DEBUG=n
